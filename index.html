
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เว็บไซต์ของฉัน</title>
  <style>
    body {
      font-family: sans-serif;
      background: linear-gradient(135deg, #160d35, #40206d);
      color: white;
      text-align: center;
      padding: 60px 20px;
    }
    .card {
      max-width: 500px;
      margin: auto;
      padding: 35px;
      border: 2px solid #ffd36a;
      border-radius: 20px;
      background: #211342;
    }
    h1 { color: #ffd36a; }
  </style>
</head>
<body>
  <div class="card">
    <h1>ยินดีต้อนรับ</h1>
    <p>เว็บไซต์ของฉันเปิดใช้งานแล้ว!</p>
    <p>สามารถเข้าชมได้โดยไม่ต้องล็อกอิน</p>
  </div>
</body>
</html>
